<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080908">
  <meta name="description" content="Links oficiais de Daniel Martins e acesso à Planilha Financeira.">
  <title>Daniel Martins</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/config.js"></script>
  <script defer src="js/script.js"></script>
</head>
<body>
  <main class="bio">
    <header class="profile">
      <div class="portrait"><img id="profile-photo" src="assets/images/bio.jpeg" alt="Daniel Martins" width="126" height="126"></div>
      <h1>Daniel Martins</h1>
    </header>

    <nav class="socials" aria-label="Redes sociais">
      <a class="social" data-link="instagram" target="_blank" rel="noopener" role="link" aria-disabled="true" aria-label="Instagram" title="Instagram"><img src="assets/icons/instagram.svg" alt="" width="24" height="24"></a>
      <a class="social" data-link="youtube" target="_blank" rel="noopener" role="link" aria-disabled="true" aria-label="YouTube" title="YouTube"><img src="assets/icons/youtube.svg" alt="" width="24" height="24"></a>
      <a class="social" data-link="tiktok" target="_blank" rel="noopener" role="link" aria-disabled="true" aria-label="TikTok" title="TikTok"><img src="assets/icons/tiktok.svg" alt="" width="24" height="24"></a>
    </nav>

    <nav class="actions" aria-label="Comunidade, planilha, lives e contato">
      <a class="action telegram" data-link="telegram" target="_blank" rel="noopener" role="link" aria-disabled="true">
        <img src="assets/icons/telegram.svg" alt="" width="27" height="27">
        <span>Comunidade no Telegram</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="action kick" data-link="kick" target="_blank" rel="noopener" role="link" aria-disabled="true">
        <img src="assets/icons/kick.svg" alt="" width="27" height="27">
        <span>Minhas Lives na Kick</span>
        <span id="kick-live" class="live" role="status" hidden>AO VIVO</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="action" data-link="planilha" role="link" aria-disabled="true">
        <img src="assets/icons/planilha.svg" alt="" width="27" height="27">
        <span>Minha Planilha Financeira</span>
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </a>
      <a class="action whatsapp" data-link="whatsapp" role="link" aria-disabled="true">
        <img src="assets/icons/whatsapp.svg" alt="" width="27" height="27">
        <span>Fale Comigo no WhatsApp</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>
  </main>
</body>
</html>
