<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Baixe grátis o e-book de Daniel Martins sobre os primeiros passos no marketing digital pelo celular.">
  <title>Comece por aqui | Daniel Martins</title>
  <style>
    :root { color-scheme: dark; --verde: #d4ff4f; --texto: #f5f5f0; --suave: #b8b8ae; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--texto);
      background: radial-gradient(ellipse at 50% 0%, #2d3a0c, #0a0a0a 65%);
      font: 1rem/1.5 Inter, system-ui, sans-serif;
    }
    main { width: min(100%, 900px); margin: auto; padding: clamp(20px, 5vw, 52px); }
    .voltar { display: inline-flex; min-height: 44px; align-items: center; color: var(--suave); }
    .livro {
      display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr);
      align-items: center; gap: clamp(24px, 7vw, 68px); margin-top: 24px;
    }
    .capa {
      display: block; width: 100%; height: auto; border: 1px solid #414634;
      border-radius: 14px; box-shadow: 0 12px 32px #0008;
    }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 5.6vw, 3rem); line-height: 1.11; }
    p { margin: 0 0 24px; color: var(--suave); }
    .acoes { display: flex; flex-wrap: wrap; gap: 12px; }
    .acao {
      display: inline-flex; justify-content: center; align-items: center; min-height: 48px;
      padding: 10px 18px; border: 1px solid #606154; border-radius: 12px;
      color: var(--texto); text-decoration: none; font-weight: 650;
    }
    .baixar { color: #101400; background: var(--verde); border-color: var(--verde); }
    a:focus-visible { outline: 3px solid var(--verde); outline-offset: 4px; }
    @media (max-width: 620px) {
      .livro { grid-template-columns: minmax(0, 1fr); text-align: center; margin-top: 12px; }
      .capa { width: min(53vw, 224px); margin: auto; }
      .acoes { justify-content: center; }
      .acao { flex: 1 1 135px; }
    }
  </style>
</head>
<body>
  <main>
    <a class="voltar" href="./">Voltar à bio</a>
    <section class="livro" aria-labelledby="titulo">
      <img class="capa" src="capa-ebook.png" alt="Capa do e-book Comece por aqui, de Daniel Martins">
      <div>
        <h1 id="titulo">Comece por aqui: marketing digital pelo celular</h1>
        <p>E-book gratuito de Daniel Martins para aprender os primeiros passos no marketing digital.</p>
        <div class="acoes">
          <a class="acao baixar" href="ebook-comece-por-aqui.pdf" download>Baixar grátis</a>
          <a class="acao" href="ebook-comece-por-aqui.pdf">Abrir PDF</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
